name: Release

# Push a tag like v0.2.0 to build, sign (Developer ID), notarize, staple, attest
# and publish a GitHub Release. Secrets live in the protected "release" environment,
# which only v* tags can use. Set them up with scripts/setup-signing.sh.
# If HOMEBREW_TAP_TOKEN is set in that environment, the cask in badriram/homebrew-tools is bumped too.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write      # create the GitHub Release
      id-token: write      # build provenance attestation
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Import Developer ID certificate into a temporary keychain
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS=$(openssl rand -base64 32)
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" \
            || { echo "Developer ID Application identity not found"; exit 1; }

      - name: Build and sign
        run: |
          VERSION="${TAG#v}" BUILD_NUMBER="${{ github.run_number }}" \
          SIGN_IDENTITY="Developer ID Application" ./build.sh
          codesign --verify --strict --deep --verbose=2 build/DockPeek.app

      - name: Notarize and staple
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY"
          ditto -c -k --keepParent build/DockPeek.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json"
          cat "$RUNNER_TEMP/notary.json"
          status=$(jq -r .status "$RUNNER_TEMP/notary.json")
          if [ "$status" != "Accepted" ]; then
            xcrun notarytool log "$(jq -r .id "$RUNNER_TEMP/notary.json")" \
              --key "$KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" || true
            exit 1
          fi
          xcrun stapler staple build/DockPeek.app
          spctl --assess --type execute --verbose=2 build/DockPeek.app

      - name: Package
        run: |
          ditto -c -k --keepParent build/DockPeek.app "DockPeek-$TAG.zip"
          shasum -a 256 "DockPeek-$TAG.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: DockPeek-${{ github.ref_name }}.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "DockPeek-$TAG.zip" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "DockPeek $TAG" --generate-notes --verify-tag

      - name: Update the Homebrew cask in badriram/homebrew-tools
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag $TAG is not vX.Y.Z; skipping cask update"; exit 0; }
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then echo "HOMEBREW_TAP_TOKEN not set; skipping cask update"; exit 0; fi
          VERSION="${TAG#v}"
          SHA=$(awk '{print $1}' SHA256SUMS.txt)
          [[ "$SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "Bad checksum"; exit 1; }
          TAP="$RUNNER_TEMP/homebrew-tools"
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/badriram/homebrew-tools.git" "$TAP"
          cd "$TAP"
          perl -pi -e "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/dockpeek.rb
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump dockpeek to $VERSION" || { echo "Cask already at $VERSION"; exit 0; }
          git push origin HEAD

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notarize.zip"
          rm -rf "$RUNNER_TEMP/homebrew-tools"
